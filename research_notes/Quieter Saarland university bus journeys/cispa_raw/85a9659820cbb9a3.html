<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Multi-Agent Seminar</title>
<meta name="description" content="Seminar on LLM-based Multi-agent Systems â Saarland University, Winter Semester 2026/27.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --paper:#F2F4F3;
  --surface:#FFFFFF;
  --sunken:#E8ECEB;
  --ink:#141C1E;
  --ink-2:#3B4A4D;
  --muted:#6B7B7E;
  --line:#D9DFDE;
  --line-2:#C4CECD;
  --accent:#0E6E73;
  --accent-2:#0A5559;
  --accent-soft:#DDECEB;
  --flag:#8A5510;
  --flag-soft:#F4E9D6;
  --shadow:0 1px 2px rgba(20,28,30,.05), 0 10px 30px -22px rgba(20,28,30,.45);

  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif:"Newsreader", Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --wrap:64rem;
  --prose:62ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0E1416;
    --surface:#151D1F;
    --sunken:#1A2426;
    --ink:#E6EDEC;
    --ink-2:#BDC9C8;
    --muted:#8B9C9D;
    --line:#243032;
    --line-2:#31403F;
    --accent:#5FC2C2;
    --accent-2:#8BD8D6;
    --accent-soft:#123130;
    --flag:#DDA94E;
    --flag-soft:#2B2415;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --paper:#0E1416;
  --surface:#151D1F;
  --sunken:#1A2426;
  --ink:#E6EDEC;
  --ink-2:#BDC9C8;
  --muted:#8B9C9D;
  --line:#243032;
  --line-2:#31403F;
  --accent:#5FC2C2;
  --accent-2:#8BD8D6;
  --accent-soft:#123130;
  --flag:#DDA94E;
  --flag-soft:#2B2415;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -22px rgba(0,0,0,.8);
}

/* ----------------------------------------------------------------- base */
*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:4.5rem; }
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  * { transition:none !important; animation:none !important; }
}
a { color:var(--accent-2); text-decoration:none; text-underline-offset:.18em;
    text-decoration-thickness:.06em; transition:color .15s ease; }
a:hover { color:var(--accent); text-decoration:underline; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
h1,h2,h3,h4,h5,h6 { text-wrap:balance; margin:0; font-size:inherit; font-weight:inherit; }
p { margin:0; }
ul { margin:0; padding:0; list-style:none; }

.wrap { width:100%; max-width:var(--wrap); margin-inline:auto; padding-inline:clamp(1.25rem,5vw,2.5rem); }
.prose { max-width:var(--prose); }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.skip { position:absolute; left:-9999px; top:0; }
.skip:focus { left:1rem; top:1rem; z-index:50; background:var(--surface); color:var(--ink);
  padding:.5rem .9rem; border:1px solid var(--line-2); border-radius:4px; }

/* ------------------------------------------------------------------ nav */
.topbar {
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner { display:flex; align-items:center; gap:1.5rem; min-height:3.4rem; }
.brand {
  font-family:var(--mono); font-size:.78rem; font-weight:500;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
  white-space:nowrap; flex:none;
}
.brand::before {
  content:""; display:inline-block; width:.5rem; height:.5rem; margin-right:.55rem;
  background:var(--accent); border-radius:50%; vertical-align:.05em;
}
.nav { display:flex; gap:1.25rem; overflow-x:auto; scrollbar-width:none; margin-left:auto; }
.nav::-webkit-scrollbar { display:none; }
.nav a {
  font-size:.85rem; color:var(--muted); white-space:nowrap;
  padding-block:.2rem; border-bottom:1px solid transparent;
}
.nav a:hover { color:var(--ink); text-decoration:none; border-bottom-color:var(--accent); }

/* ---------------------------------------------------------------- hero */
.hero { padding-top:clamp(3rem,8vw,5.5rem); padding-bottom:clamp(2rem,4vw,3rem); }
.kicker {
  font-family:var(--mono); font-size:.76rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--accent); margin-bottom:1.1rem;
}
.hero h1 {
  font-family:var(--serif); font-weight:400;
  font-size:clamp(2.35rem,6vw,3.75rem); line-height:1.06;
  letter-spacing:-.02em; max-width:18ch;
}
.affil { margin-top:1rem; color:var(--muted); font-size:.95rem; }
.lede { margin-top:1.6rem; font-size:1.075rem; color:var(--ink-2); max-width:60ch; }

/* --------------------------------------------------------------- notice */
.notice {
  display:flex; gap:1rem; align-items:flex-start;
  margin-top:2.5rem; padding:1rem 1.15rem;
  background:var(--accent-soft); border:1px solid transparent;
  border-left:2px solid var(--accent); border-radius:3px;
  color:var(--ink-2); font-size:.94rem; max-width:var(--prose);
}
.notice-label {
  flex:none; font-family:var(--mono); font-size:.72rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--accent); padding-top:.22rem;
}
.notice-body { display:flex; flex-direction:column; gap:.9rem; min-width:0; }
.notice-list { display:flex; flex-direction:column; gap:.6rem; }
.notice-list li { position:relative; padding-left:1.15rem; }
.notice-list li::before {
  content:""; position:absolute; left:0; top:.58em; width:.36rem; height:.36rem;
  background:var(--accent); border-radius:50%; opacity:.75;
}

/* ---------------------------------------------------------------- facts */
.facts {
  margin-top:2.75rem;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(13rem,1fr));
  border-top:1px solid var(--line); border-left:1px solid var(--line);
}
.fact {
  background:var(--surface);
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:1rem 1.1rem 1.05rem; display:flex; flex-direction:column; gap:.3rem;
}
.fact-label {
  font-family:var(--mono); font-size:.7rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted);
}
.fact-value { font-size:.95rem; color:var(--ink); }

/* -------------------------------------------------------------- section */
.section { padding-block:clamp(3rem,6vw,4.5rem); border-top:1px solid var(--line); }
.section:first-of-type { border-top:none; }
.section h2 {
  font-family:var(--serif); font-weight:400; font-size:clamp(1.75rem,3.4vw,2.3rem);
  letter-spacing:-.015em; line-height:1.15; margin-bottom:1.5rem;
}
.section-intro { color:var(--ink-2); max-width:var(--prose); }
.stack { display:flex; flex-direction:column; gap:1.1rem; }
.block-gap { margin-top:2.5rem; }
h3.sub {
  font-size:.8rem; font-family:var(--mono); font-weight:500; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); margin-bottom:1rem;
}

/* --------------------------------------------------------------- themes */
.themes {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(15rem,1fr));
  border-top:1px solid var(--line); border-left:1px solid var(--line); margin-top:2.5rem;
}
.theme {
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:1.4rem 1.35rem 1.5rem; display:flex; flex-direction:column; gap:.5rem;
}
.theme-name { font-weight:600; font-size:.98rem; }
.theme-name::before {
  content:""; display:block; width:1.6rem; height:2px; background:var(--accent); margin-bottom:.85rem;
}
.theme-text { font-size:.9rem; color:var(--muted); }

/* -------------------------------------------------------------- grading */
.grades { display:flex; flex-direction:column; gap:1.35rem; max-width:36rem; }
.grade { display:grid; grid-template-columns:3.2rem 1fr; gap:0 1rem; align-items:baseline; }
.grade-pct { font-family:var(--mono); font-size:1.15rem; color:var(--accent); font-variant-numeric:tabular-nums; }
.grade-label { font-weight:600; font-size:1rem; }
.grade-detail { grid-column:2; font-size:.9rem; color:var(--muted); margin-top:.1rem; }
.grade-bar { grid-column:2; height:3px; background:var(--sunken); border-radius:2px; margin-top:.7rem; overflow:hidden; }
.grade-bar span { display:block; height:100%; background:var(--accent); border-radius:2px; }

.bullets { display:flex; flex-direction:column; gap:.7rem; max-width:var(--prose); }
.bullets li { position:relative; padding-left:1.35rem; color:var(--ink-2); font-size:.96rem; }
.bullets li::before {
  content:""; position:absolute; left:0; top:.62em; width:.42rem; height:.42rem;
  border:1px solid var(--line-2); background:var(--surface); transform:rotate(45deg);
}

/* ------------------------------------------------------------- schedule */
.deadlines {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));
  border-top:1px solid var(--line); border-left:1px solid var(--line);
}
.deadline {
  background:var(--surface);
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:.9rem 1.05rem; display:flex; flex-direction:column; gap:.25rem;
}
.deadline > .chip { align-self:flex-start; }
.deadline-label { font-size:.9rem; color:var(--ink-2); }
.deadline-date { font-family:var(--mono); font-size:.88rem; color:var(--ink); font-variant-numeric:tabular-nums; }

.days { display:flex; flex-direction:column; gap:0; }
.day { padding-block:1.4rem; border-top:1px solid var(--line); }
.day:first-child { border-top:none; }
.day-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:.35rem 1rem; }
.day-date {
  font-family:var(--mono); font-size:.76rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); flex:none; min-width:9rem;
}
.day-label { font-size:1.05rem; font-weight:600; line-height:1.4; }
.day-note { margin-top:.4rem; font-size:.9rem; color:var(--muted); max-width:var(--prose); }
.slots { margin-top:.95rem; display:flex; flex-direction:column; gap:.5rem; }
.slot { display:flex; flex-wrap:wrap; gap:.35rem .9rem; font-size:.94rem; color:var(--ink-2); }
.slot-time { font-family:var(--mono); font-size:.85rem; color:var(--muted); min-width:9rem; flex:none; font-variant-numeric:tabular-nums; }

/* --------------------------------------------------------------- papers */
.paper-group { margin-top:2.75rem; }
.paper-group:first-of-type { margin-top:2rem; }
.group-note { font-size:.9rem; color:var(--muted); margin-top:-.5rem; margin-bottom:1.1rem; max-width:var(--prose); }
.papers { display:flex; flex-direction:column; }
.paper {
  display:grid; grid-template-columns:2.4rem 1fr; gap:.2rem .6rem;
  padding-block:1rem; border-top:1px solid var(--line);
}
.paper:first-child { border-top:1px solid var(--line-2); }
.paper-num {
  grid-row:1 / span 3; font-family:var(--mono); font-size:.82rem; color:var(--muted);
  font-variant-numeric:tabular-nums; padding-top:.15rem;
}
.paper-untitled { grid-column:2; }
.paper-title { grid-column:2; font-family:var(--serif); font-size:1.14rem; font-weight:400; line-height:1.35; max-width:54ch; }
.paper-title a { color:var(--ink); }
.paper-title a:hover { color:var(--accent); text-decoration:none;
  text-decoration-line:underline; text-decoration-color:var(--accent); }
.paper-meta { grid-column:2; display:flex; flex-wrap:wrap; align-items:center; gap:.4rem .75rem; margin-top:.4rem; }
.paper-note { grid-column:2; font-size:.85rem; color:var(--muted); margin-top:.35rem; }
.venue { font-family:var(--mono); font-size:.76rem; color:var(--muted); letter-spacing:.02em; }
.assigned { font-size:.82rem; color:var(--ink-2); }
.assigned strong { font-weight:600; color:var(--ink); }

/* ---------------------------------------------------------------- chips */
.chip {
  display:inline-block; font-family:var(--mono); font-size:.68rem; letter-spacing:.09em;
  text-transform:uppercase; padding:.16rem .45rem; border-radius:3px;
  background:var(--flag-soft); color:var(--flag); white-space:nowrap;
}

/* --------------------------------------------------------------- people */
.people {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));
  border-top:1px solid var(--line); border-left:1px solid var(--line);
}
.person {
  background:var(--surface);
  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:1.25rem 1.25rem 1.35rem; display:flex; flex-direction:column; gap:.3rem;
}
.person-role { font-family:var(--mono); font-size:.7rem; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); }
.person-name { font-family:var(--serif); font-size:1.25rem; font-weight:400; }
.person-affil { font-size:.88rem; color:var(--muted); }
.person-links { display:flex; gap:.85rem; margin-top:.35rem; font-size:.85rem; }

/* ------------------------------------------------------------ resources */
.links { display:flex; flex-direction:column; }
.link-row {
  display:grid; grid-template-columns:minmax(9rem,13rem) 1fr; gap:.25rem 1.5rem;
  padding-block:.95rem; border-top:1px solid var(--line); align-items:baseline;
}
.link-row:first-child { border-top:1px solid var(--line-2); }
.link-label { font-size:.98rem; font-weight:500; }
.link-detail { font-size:.88rem; color:var(--muted); }
@media (max-width: 34rem) {
  .link-row { grid-template-columns:1fr; }
  .paper { grid-template-columns:2rem 1fr; }
  .day-date, .slot-time { min-width:auto; }
}

/* ----------------------------------------------------------- external link */
.ext-icon { display:inline-flex; margin-left:.3em; opacity:.6; position:relative; top:-.06em; }
.ext-icon svg { display:block; }
a:hover .ext-icon { opacity:1; }

/* --------------------------------------------------------------- footer */
.footer { border-top:1px solid var(--line); padding-block:2.5rem 3.5rem; margin-top:1rem; }
.footer-inner { display:flex; flex-wrap:wrap; gap:1rem 2.5rem; justify-content:space-between; align-items:baseline; }
.footer p { font-size:.86rem; color:var(--muted); }
.footer .updated { font-family:var(--mono); font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; }
.footer-legal { display:flex; gap:.6rem; margin-top:1.5rem; font-size:.82rem; }
.footer-legal a { color:var(--muted); }
.footer-legal a:hover { color:var(--ink); }
.footer-legal span { color:var(--line-2); }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand" id="brand"></span>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
</header>

<main id="main"></main>
<footer class="footer" id="footer"></footer>

<script src="content.js"></script>
<script>
(function () {
  "use strict";
  var C = window.COURSE || {};
  var main = document.getElementById("main");
  var navEl = document.getElementById("nav");
  var navItems = [];

  /* ---------------------------------------------------------- helpers */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== "") n.textContent = text;
    return n;
  }
  function has(v) { return typeof v === "string" ? v.trim() !== "" : !!v; }

  /* Small arrow marking a link that leaves the site. currentColor means it
     always matches the link's own color, in both themes, with no extra work. */
  function extIcon() {
    var span = el("span", "ext-icon");
    span.innerHTML = '<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2 8L8 2M8 2H3.5M8 2V6.5" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return span;
  }
  /* Marks a link as leaving the site: new tab + the external-link icon. */
  function markExternal(a) {
    a.target = "_blank"; a.rel = "noopener";
    a.appendChild(extIcon());
    return a;
  }

  /* Parses [label](url) into real links; everything else stays plain text. */
  function inline(str) {
    var frag = document.createDocumentFragment();
    var re = /\[([^\]]+)\]\(([^)\s]*)\)/g, last = 0, m;
    while ((m = re.exec(str)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(str.slice(last, m.index)));
      if (has(m[2])) {
        var a = el("a", null, m[1]);
        a.href = m[2];
        if (/^https?:/i.test(m[2])) markExternal(a);
        frag.appendChild(a);
      } else {
        frag.appendChild(tbd(m[1]));
      }
      last = re.lastIndex;
    }
    if (last < str.length) frag.appendChild(document.createTextNode(str.slice(last)));
    return frag;
  }
  function para(cls, str) { var p = el("p", cls); p.appendChild(inline(str)); return p; }
  function tbd(label) { return el("span", "chip", label || "TBD"); }
  function value(str, fallback) {
    if (has(str)) { var s = el("span"); s.appendChild(inline(str)); return s; }
    return tbd(fallback);
  }

  function section(key, data, headingOverride) {
    var s = el("section", "section");
    s.id = key;
    var w = el("div", "wrap");
    s.appendChild(w);
    w.appendChild(el("h2", null, headingOverride || data.heading || ""));
    navItems.push({ id: key, label: data.nav || data.heading || key });
    main.appendChild(s);
    return w;
  }

  /* ------------------------------------------------------------- header */
  var meta = C.meta || {};
  document.getElementById("brand").textContent = meta.shortTitle || meta.title || "";
  if (has(meta.title)) document.title = meta.title;

  var hero = el("header", "hero");
  var hw = el("div", "wrap");
  hero.appendChild(hw);
  if (has(meta.kicker)) hw.appendChild(el("p", "kicker", meta.kicker));
  hw.appendChild(el("h1", null, meta.title || ""));
  if (has(meta.institution)) hw.appendChild(para("affil", meta.institution));
  if (has(meta.lede)) hw.appendChild(para("lede", meta.lede));

  if (C.announcements && (C.announcements.items || []).length) {
    var n = el("div", "notice");
    n.appendChild(el("span", "notice-label", C.announcements.label || "Announcements"));
    var nb = el("div", "notice-body");
    if (has(C.announcements.intro)) nb.appendChild(para(null, C.announcements.intro));
    var nl = el("ul", "notice-list");
    C.announcements.items.forEach(function (item) {
      var li = el("li");
      li.appendChild(inline(item.text));
      nl.appendChild(li);
    });
    nb.appendChild(nl);
    n.appendChild(nb);
    hw.appendChild(n);
  }

  if (C.facts && C.facts.length) {
    var fg = el("div", "facts");
    C.facts.forEach(function (f) {
      var box = el("div", "fact");
      box.appendChild(el("span", "fact-label", f.label));
      var v = el("span", "fact-value");
      v.appendChild(has(f.value) ? inline(f.value) : tbd());
      box.appendChild(v);
      fg.appendChild(box);
    });
    hw.appendChild(fg);
  }
  main.appendChild(hero);

  /* -------------------------------------------------------------- about */
  if (C.about) {
    var w = section("about", C.about);
    var st = el("div", "stack prose");
    (C.about.paragraphs || []).forEach(function (p) { st.appendChild(para(null, p)); });
    w.appendChild(st);
    if (C.about.themes && C.about.themes.length) {
      var tg = el("div", "themes");
      C.about.themes.forEach(function (t) {
        var box = el("div", "theme");
        box.appendChild(el("h3", "theme-name", t.name));
        box.appendChild(para("theme-text", t.text));
        tg.appendChild(box);
      });
      w.appendChild(tg);
    }
  }

  /* --------------------------------------------------------- assessment */
  if (C.assessment) {
    var a = C.assessment, w = section("structure", a);
    if (has(a.intro)) w.appendChild(para("section-intro", a.intro));
    if (a.grading && a.grading.length) {
      var g = el("div", "grades block-gap");
      a.grading.forEach(function (row) {
        var r = el("div", "grade");
        r.appendChild(el("span", "grade-pct", row.weight + "%"));
        r.appendChild(el("span", "grade-label", row.label));
        if (has(row.detail)) r.appendChild(el("span", "grade-detail", row.detail));
        var bar = el("div", "grade-bar"), fill = el("span");
        fill.style.width = Math.max(0, Math.min(100, row.weight)) + "%";
        bar.appendChild(fill);
        r.appendChild(bar);
        g.appendChild(r);
      });
      w.appendChild(g);
    }
    if (a.requirements && (a.requirements.items || []).length) {
      var box = el("div", "block-gap");
      box.appendChild(el("h3", "sub", a.requirements.heading || "Requirements"));
      var ul = el("ul", "bullets");
      a.requirements.items.forEach(function (i) { var li = el("li"); li.appendChild(inline(i)); ul.appendChild(li); });
      box.appendChild(ul);
      w.appendChild(box);
    }
  }

  /* ----------------------------------------------------------- schedule */
  if (C.schedule) {
    var s = C.schedule, w = section("schedule", s);
    if (has(s.intro)) w.appendChild(para("section-intro", s.intro));
    if (s.deadlines && s.deadlines.length) {
      var box = el("div", null);
      box.appendChild(el("h3", "sub", "Key dates"));
      var dg = el("div", "deadlines");
      s.deadlines.forEach(function (d) {
        var b = el("div", "deadline");
        b.appendChild(el("span", "deadline-label", d.label));
        if (has(d.date)) b.appendChild(el("span", "deadline-date", d.date));
        else b.appendChild(tbd());
        dg.appendChild(b);
      });
      box.appendChild(dg);
      w.appendChild(box);
    }
    if (s.days && s.days.length) {
      var box2 = el("div", "block-gap");
      box2.appendChild(el("h3", "sub", "Sessions"));
      var days = el("div", "days");
      s.days.forEach(function (d) {
        var art = el("article", "day");
        var head = el("div", "day-head");
        if (has(d.date)) head.appendChild(el("span", "day-date", d.date));
        else { var wrapc = el("span", "day-date"); wrapc.appendChild(tbd("Date TBD")); head.appendChild(wrapc); }
        head.appendChild(el("h4", "day-label", d.label));
        art.appendChild(head);
        if (has(d.note)) art.appendChild(para("day-note", d.note));
        if (d.slots && d.slots.length) {
          var ul = el("ul", "slots");
          d.slots.forEach(function (sl) {
            var li = el("li", "slot");
            var t = el("span", "slot-time");
            if (has(sl.time)) t.textContent = sl.time; else t.appendChild(tbd("Time TBD"));
            li.appendChild(t);
            li.appendChild(el("span", "slot-title", sl.title));
            ul.appendChild(li);
          });
          art.appendChild(ul);
        }
        days.appendChild(art);
      });
      box2.appendChild(days);
      w.appendChild(box2);
    }
  }

  /* ------------------------------------------------------------- papers */
  if (C.papers && (C.papers.groups || []).length) {
    var p = C.papers, w = section("papers", p);
    if (has(p.intro)) w.appendChild(para("section-intro", p.intro));
    var counter = 0;
    p.groups.forEach(function (grp) {
      var box = el("div", "paper-group");
      box.appendChild(el("h3", "sub", grp.name));
      if (has(grp.note)) box.appendChild(para("group-note", grp.note));
      var list = el("ul", "papers");
      (grp.items || []).forEach(function (item) {
        var li = el("li", "paper");
        if (grp.numbered) {
          counter += 1;
          li.appendChild(el("span", "paper-num", (counter < 10 ? "0" : "") + counter));
        } else {
          li.appendChild(el("span", "paper-num"));
        }
        var h = el("h4", "paper-title");
        if (has(item.url)) {
          var a = el("a", null, item.title);
          a.href = item.url; markExternal(a);
          h.appendChild(a);
        } else {
          h.appendChild(document.createTextNode(item.title));
        }
        li.appendChild(h);

        var meta = el("div", "paper-meta");
        var cite = [item.authors, item.venue].filter(has).join(" Â· ");
        if (cite) meta.appendChild(el("span", "venue", cite));
        if (grp.numbered) {
          if (has(item.presenter)) {
            var as = el("span", "assigned");
            as.appendChild(document.createTextNode("Presented by "));
            as.appendChild(el("strong", null, item.presenter));
            meta.appendChild(as);
          } else {
            meta.appendChild(tbd("Unassigned"));
          }
          if (has(item.slot)) meta.appendChild(el("span", "assigned", item.slot));
        }
        if (meta.childNodes.length) li.appendChild(meta);
        if (has(item.note)) li.appendChild(para("paper-note", item.note));
        list.appendChild(li);
      });
      box.appendChild(list);
      w.appendChild(box);
    });
  }

  /* ------------------------------------------------------------- people */
  if (C.people && (C.people.members || []).length) {
    var w = section("people", C.people);
    var grid = el("div", "people");
    C.people.members.forEach(function (m) {
      var box = el("div", "person");
      if (has(m.role)) box.appendChild(el("span", "person-role", m.role));
      box.appendChild(el("h3", "person-name", m.name));
      if (has(m.affiliation)) box.appendChild(el("p", "person-affil", m.affiliation));
      var links = el("div", "person-links");
      if (has(m.email)) { var a1 = el("a", null, "E-mail"); a1.href = "mailto:" + m.email; links.appendChild(a1); }
      if (has(m.url)) { var a2 = el("a", null, "Homepage"); a2.href = m.url; markExternal(a2); links.appendChild(a2); }
      if (links.childNodes.length) box.appendChild(links);
      grid.appendChild(box);
    });
    w.appendChild(grid);
  }

  /* ---------------------------------------------------------- resources */
  if (C.resources && (C.resources.items || []).length) {
    var w = section("links", C.resources);
    var list = el("div", "links");
    C.resources.items.forEach(function (r) {
      var row = el("div", "link-row");
      var lab = el("div", "link-label");
      if (has(r.url)) {
        var a = el("a", null, r.label);
        a.href = r.url; markExternal(a);
        lab.appendChild(a);
      } else {
        lab.appendChild(document.createTextNode(r.label + " "));
        lab.appendChild(tbd());
      }
      row.appendChild(lab);
      if (has(r.detail)) row.appendChild(el("div", "link-detail", r.detail));
      list.appendChild(row);
    });
    w.appendChild(list);
  }

  /* ------------------------------------------------------------- footer */
  var f = C.footer || {};
  var fwrap = el("div", "wrap");
  var fw = el("div", "footer-inner");
  var left = el("div");
  if (has(f.contactText)) {
    if (has(f.contactLabel)) left.appendChild(el("p", null, f.contactLabel));
    left.appendChild(para(null, f.contactText));
  }
  fw.appendChild(left);
  var right = el("div");
  if (has(meta.updated)) right.appendChild(el("p", "updated", "Last updated " + meta.updated));
  fw.appendChild(right);
  fwrap.appendChild(fw);
  /* Imprint / Data protection: quiet footer links straight to the MPI-SWS
     legal generator â that page is the source of truth, not local text. */
  if (C.legal && (C.legal.items || []).length) {
    var flRow = el("div", "footer-legal");
    C.legal.items.forEach(function (item, idx) {
      if (idx > 0) flRow.appendChild(el("span", null, "Â·"));
      var a = el("a", null, item.label);
      a.href = item.url; markExternal(a);
      flRow.appendChild(a);
    });
    fwrap.appendChild(flRow);
  }
  document.getElementById("footer").appendChild(fwrap);

  /* ---------------------------------------------------------------- nav */
  navItems.forEach(function (n) {
    var a = el("a", null, n.label);
    a.href = "#" + n.id;
    navEl.appendChild(a);
  });
})();
</script>
</body>
</html>
